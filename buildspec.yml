# ─────────────────────────────────────────────────────────────────────────────
# AWS CodeBuild – buildspec for Swift / CrossRemit (Next.js 16 standalone)
#
# Pipeline flow:
#   CodePipeline → CodeBuild (this file) → S3 artifact → CodeDeploy → EC2
#
# Secrets strategy:
#   • NEXT_PUBLIC_* vars are baked into the client bundle at build time.
#     Store them in SSM Parameter Store and reference them below.
#   • Server-side secrets (SERVICE_ROLE_KEY, GROQ, etc.) are NOT needed at
#     build time — dummy values are used. Real values live in .env.local on
#     the EC2 instance and are preserved across deployments by the lifecycle
#     scripts.
# ─────────────────────────────────────────────────────────────────────────────

