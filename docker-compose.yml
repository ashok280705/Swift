version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# docker-compose for Swift / CrossRemit
#
# Usage (local dev / testing):
#   1. Copy app/.env.local to .env in this directory (repo root)
#   2. docker compose up --build
#   3. Open http://localhost:3000
#
# The .env file at repo root is loaded automatically by docker-compose.
# It must contain all vars listed in the environment section below.
# ─────────────────────────────────────────────────────────────────────────────

services:
  swift-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be baked in at build time.
        # docker-compose reads these from the .env file at repo root.
        NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_RAZORPAY_KEY_ID:   ${NEXT_PUBLIC_RAZORPAY_KEY_ID}

    container_name: swift-web
    restart: unless-stopped

    ports:
      - "3000:3000"

    # Load ALL secrets from the .env file at repo root.
    # Server-side vars are injected here at runtime (not baked into image).
    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
